<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Фон -->
  <rect width="1280" height="720" fill="#1C1C1E"/>
  <!-- Жёлтые полосы -->
  <rect x="0" y="0" width="1280" height="12" fill="#FFCC00"/>
  <rect x="0" y="708" width="1280" height="12" fill="#FFCC00"/>

  <!-- Служебная строка -->
  <text x="80" y="90" font-family="Arial" font-size="16" fill="#FFCC00" letter-spacing="3">МАТЕРИАЛЫ ДЛЯ ПРОВЕРКИ</text>

  <!-- Жёлтая плашка -->
  <rect x="80" y="150" width="8" height="120" fill="#FFCC00"/>
  <text x="120" y="195" font-family="Arial" font-size="44" font-weight="bold" fill="#FFFFFF">Проверьте сами</text>
  <text x="120" y="245" font-family="Arial" font-size="22" fill="#C7C7CC">Пуш «Спешите?» — вариант А, открывается на телефоне</text>

  <!-- Левая карточка: QR-код -->
  <g id="qr-block">
    <rect x="80" y="290" width="460" height="360" rx="24" fill="#2C2C2E"/>
    <text x="110" y="335" font-family="Arial" font-size="15" fill="#FFCC00" letter-spacing="2">QR-КОД</text>
    <text x="110" y="365" font-family="Arial" font-size="18" fill="#FFFFFF">Наведите камеру телефона</text>

    <!-- Белая подложка под QR -->
    <rect x="150" y="390" width="220" height="220" rx="16" fill="#FFFFFF"/>

    <!-- Плейсхолдер QR-паттерна (заменить на реальный QR) -->
    <g id="qr-pattern" fill="#1C1C1E">
      <!-- Углы-маркеры -->
      <rect x="165" y="405" width="46" height="46" rx="4" fill="#1C1C1E"/>
      <rect x="173" y="413" width="30" height="30" fill="#FFFFFF"/>
      <rect x="181" y="421" width="14" height="14" fill="#1C1C1E"/>

      <rect x="309" y="405" width="46" height="46" rx="4" fill="#1C1C1E"/>
      <rect x="317" y="413" width="30" height="30" fill="#FFFFFF"/>
      <rect x="325" y="421" width="14" height="14" fill="#1C1C1E"/>

      <rect x="165" y="549" width="46" height="46" rx="4" fill="#1C1C1E"/>
      <rect x="173" y="557" width="30" height="30" fill="#FFFFFF"/>
      <rect x="181" y="565" width="14" height="14" fill="#1C1C1E"/>

      <!-- Условный «шум» в центре -->
      <rect x="225" y="405" width="16" height="16"/>
      <rect x="249" y="405" width="16" height="16"/>
      <rect x="273" y="405" width="16" height="16"/>
      <rect x="225" y="429" width="16" height="16"/>
      <rect x="273" y="429" width="16" height="16"/>
      <rect x="249" y="453" width="16" height="16"/>
      <rect x="225" y="477" width="16" height="16"/>
      <rect x="273" y="477" width="16" height="16"/>
      <rect x="225" y="501" width="16" height="16"/>
      <rect x="249" y="501" width="16" height="16"/>
      <rect x="273" y="501" width="16" height="16"/>
      <rect x="225" y="549" width="16" height="16"/>
      <rect x="249" y="573" width="16" height="16"/>
      <rect x="273" y="549" width="16" height="16"/>
    </g>

    <!-- Подпись под QR -->
    <text x="310" y="635" font-family="Arial" font-size="14" fill="#C7C7CC" text-anchor="middle">taxi-push-variant-a.github.io</text>
  </g>

  <!-- Правая карточка: что смотреть -->
  <g id="checklist">
    <rect x="570" y="290" width="630" height="360" rx="24" fill="#FFCC00"/>
    <text x="600" y="335" font-family="Arial" font-size="15" fill="#1C1C1E" letter-spacing="2">ЧТО СМОТРЕТЬ</text>

    <circle cx="612" cy="385" r="10" fill="#1C1C1E"/>
    <text x="632" y="392" font-family="Arial" font-size="20" font-weight="bold" fill="#1C1C1E">Заголовок «Спешите?» и текст</text>
    <text x="632" y="418" font-family="Arial" font-size="16" fill="#1C1C1E">цена видна до нажатия кнопки</text>

    <circle cx="612" cy="460" r="10" fill="#1C1C1E"/>
    <text x="632" y="467" font-family="Arial" font-size="20" font-weight="bold" fill="#1C1C1E">Кнопка «Посмотреть стоимость»</text>
    <text x="632" y="493" font-family="Arial" font-size="16" fill="#1C1C1E">без обещаний низкой цены</text>

    <circle cx="612" cy="535" r="10" fill="#1C1C1E"/>
    <text x="632" y="542" font-family="Arial" font-size="20" font-weight="bold" fill="#1C1C1E">Логотип и цвета бренда</text>
    <text x="632" y="568" font-family="Arial" font-size="16" fill="#1C1C1E">фирменный жёлтый #FFCC00</text>

    <text x="600" y="620" font-family="Arial" font-size="15" fill="#1C1C1E">Если интернет не работает — скриншот на слайде 4</text>
  </g>

  <!-- Нижняя строка -->
  <rect x="80" y="670" width="1120" height="30" rx="8" fill="#1C1C1E"/>
  <text x="120" y="691" font-family="Arial" font-size="16" fill="#C7C7CC">Запасной вариант: материал уже показан на слайде 4, QR-код — дополнение, а не единственный способ</text>
</svg>