<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="12" fill="#FFCC00"/>
  <rect x="0" y="708" width="1280" height="12" fill="#1C1C1E"/>

  <!-- Левая жёлтая плашка -->
  <rect x="80" y="120" width="8" height="200" fill="#FFCC00"/>
  <text x="120" y="170" font-family="Arial" font-size="22" fill="#8E8E93" letter-spacing="2">ЗАНЯТИЕ ПО КЕЙСУ ЯНДЕКС ТАКСИ</text>
  <text x="120" y="240" font-family="Arial" font-size="52" font-weight="bold" fill="#1C1C1E">Решения на основе</text>
  <text x="120" y="305" font-family="Arial" font-size="52" font-weight="bold" fill="#1C1C1E">данных, а не мнений</text>

  <!-- Правая карточка группы -->
  <rect x="780" y="120" width="420" height="200" rx="20" fill="#F2F2F7"/>
  <text x="810" y="165" font-family="Arial" font-size="16" fill="#8E8E93" letter-spacing="1">ГРУППА</text>
  <text x="810" y="205" font-family="Arial" font-size="26" font-weight="bold" fill="#1C1C1E">Учащиеся колледжа</text>
  <text x="810" y="240" font-family="Arial" font-size="18" fill="#3A3A3C">16–18 лет · без опыта</text>
  <text x="810" y="268" font-family="Arial" font-size="18" fill="#3A3A3C">в маркетинге</text>

  <!-- Нижний блок: что тренируем -->
  <rect x="80" y="400" width="1120" height="220" rx="24" fill="#1C1C1E"/>
  <text x="120" y="455" font-family="Arial" font-size="18" fill="#FFCC00" letter-spacing="2">ЧТО ТРЕНИРУЕМ</text>
  <text x="120" y="505" font-family="Arial" font-size="28" font-weight="bold" fill="#FFFFFF">Сформулировать гипотезу → выбрать метрику →</text>
  <text x="120" y="545" font-family="Arial" font-size="28" font-weight="bold" fill="#FFFFFF">проверить, не нарушает ли решение бриф</text>
  <text x="120" y="595" font-family="Arial" font-size="18" fill="#C7C7CC">Навык универсален: бюджет, ответственность за результат, работа по чужому брифу</text>
</svg>