<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1C1C1E"/>
  <rect x="0" y="0" width="1280" height="12" fill="#FFCC00"/>
  <rect x="0" y="708" width="1280" height="12" fill="#FFCC00"/>

  <text x="80" y="100" font-family="Arial" font-size="16" fill="#FFCC00" letter-spacing="3">ЗАПАСНОЙ ВАРИАНТ И ИТОГ</text>
  <text x="80" y="165" font-family="Arial" font-size="40" font-weight="bold" fill="#FFFFFF">Если что-то пойдёт не так</text>

  <!-- Два сценария Plan B -->
  <g font-family="Arial">
    <rect x="80" y="220" width="540" height="220" rx="20" fill="#2C2C2E"/>
    <text x="110" y="270" font-size="16" fill="#FFCC00" letter-spacing="2">PLAN B — ГРУППА НЕ МОЖЕТ</text>
    <text x="110" y="310" font-size="20" font-weight="bold" fill="#FFFFFF">Даём готовую гипотезу</text>
    <text x="110" y="340" font-size="20" font-weight="bold" fill="#FFFFFF">и просим её раскритиковать</text>
    <text x="110" y="385" font-size="15" fill="#C7C7CC">Тот же навык, но с другой стороны:</text>
    <text x="110" y="408" font-size="15" fill="#C7C7CC">проверка на проверяемость</text>

    <rect x="660" y="220" width="540" height="220" rx="20" fill="#2C2C2E"/>
    <text x="690" y="270" font-size="16" fill="#FFCC00" letter-spacing="2">PLAN B — ВРЕМЯ СЖИМАЕТСЯ</text>
    <text x="690" y="310" font-size="20" font-weight="bold" fill="#FFFFFF">Сокращаем фрагмент</text>
    <text x="690" y="340" font-size="20" font-weight="bold" fill="#FFFFFF">до одной группы</text>
    <text x="690" y="385" font-size="15" fill="#C7C7CC">Одна группа защищает —</text>
    <text x="690" y="408" font-size="15" fill="#C7C7CC">остальные разбирают вместе</text>
  </g>

  <!-- Итог -->
  <rect x="80" y="490" width="1120" height="150" rx="24" fill="#FFCC00"/>
  <text x="120" y="545" font-family="Arial" font-size="18" font-weight="bold" fill="#1C1C1E" letter-spacing="1">ИТОГ</text>
  <text x="120" y="590" font-family="Arial" font-size="26" font-weight="bold" fill="#1C1C1E">Учим не «делать рекламу», а принимать решения</text>
  <text x="120" y="620" font-family="Arial" font-size="26" font-weight="bold" fill="#1C1C1E">в рамках ограничений и проверять их данными</text>
</svg>