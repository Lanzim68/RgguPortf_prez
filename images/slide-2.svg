<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F2F2F7"/>
  <rect x="0" y="0" width="1280" height="12" fill="#FFCC00"/>
  <rect x="0" y="708" width="1280" height="12" fill="#1C1C1E"/>

  <text x="80" y="100" font-family="Arial" font-size="40" font-weight="bold" fill="#1C1C1E">Задание и материалы</text>
  <text x="80" y="140" font-family="Arial" font-size="20" fill="#3A3A3C">Предложить кампанию, повышающую повторное использование, не нарушая запретов брифа</text>

  <!-- Четыре карточки материалов -->
  <g font-family="Arial">
    <!-- 1 -->
    <rect x="80" y="190" width="270" height="220" rx="20" fill="#FFFFFF"/>
    <circle cx="120" cy="235" r="22" fill="#FFCC00"/>
    <text x="120" y="242" font-size="18" font-weight="bold" fill="#1C1C1E" text-anchor="middle">1</text>
    <text x="105" y="295" font-size="20" font-weight="bold" fill="#1C1C1E">Бриф</text>
    <text x="105" y="325" font-size="15" fill="#3A3A3C">Выжимка с тремя</text>
    <text x="105" y="348" font-size="15" fill="#3A3A3C">запретами заказчика</text>

    <!-- 2 -->
    <rect x="370" y="190" width="270" height="220" rx="20" fill="#FFFFFF"/>
    <circle cx="410" cy="235" r="22" fill="#FFCC00"/>
    <text x="410" y="242" font-size="18" font-weight="bold" fill="#1C1C1E" text-anchor="middle">2</text>
    <text x="395" y="295" font-size="20" font-weight="bold" fill="#1C1C1E">Шаблон</text>
    <text x="395" y="325" font-size="15" fill="#3A3A3C">«Если… то…</text>
    <text x="395" y="348" font-size="15" fill="#3A3A3C">потому что…»</text>

    <!-- 3 -->
    <rect x="660" y="190" width="270" height="220" rx="20" fill="#FFFFFF"/>
    <circle cx="700" cy="235" r="22" fill="#FFCC00"/>
    <text x="700" y="242" font-size="18" font-weight="bold" fill="#1C1C1E" text-anchor="middle">3</text>
    <text x="685" y="295" font-size="20" font-weight="bold" fill="#1C1C1E">Таблица PESO</text>
    <text x="685" y="325" font-size="15" fill="#3A3A3C">Канал · роль ·</text>
    <text x="685" y="348" font-size="15" fill="#3A3A3C">метрика</text>

    <!-- 4 -->
    <rect x="950" y="190" width="250" height="220" rx="20" fill="#FFFFFF"/>
    <circle cx="990" cy="235" r="22" fill="#FFCC00"/>
    <text x="990" y="242" font-size="18" font-weight="bold" fill="#1C1C1E" text-anchor="middle">4</text>
    <text x="975" y="295" font-size="20" font-weight="bold" fill="#1C1C1E">Карточки</text>
    <text x="975" y="325" font-size="15" fill="#3A3A3C">Три сценария:</text>
    <text x="975" y="348" font-size="15" fill="#3A3A3C">A / B / C</text>
  </g>

  <rect x="80" y="450" width="1120" height="160" rx="24" fill="#1C1C1E"/>
  <text x="120" y="505" font-family="Arial" font-size="18" fill="#FFCC00" letter-spacing="2">ПРИНЦИП</text>
  <text x="120" y="550" font-family="Arial" font-size="26" font-weight="bold" fill="#FFFFFF">Студент работает не с пустого листа:</text>
  <text x="120" y="585" font-family="Arial" font-size="26" font-weight="bold" fill="#FFFFFF">у него есть рамка, в которую он подставляет решение</text>
</svg>